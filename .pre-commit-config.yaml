# The repository's hygiene checks; CI runs them all. Install: uv run --locked pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # frozen: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee # frozen: v2.3.1
    hooks:
      - id: mypy
        args: [--config-file=skills/fleex-hygiene/assets/mypy.ini]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--config, skills/fleex-hygiene/assets/markdownlint.yaml]
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, skills/fleex-hygiene/assets/yamllint.yaml]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: plugin-version
        name: plugin version and changelogs
        language: system
        entry: >-
          uv run --locked python skills/fleex-repo/scripts/release.py
          --manifest .claude-plugin/plugin.json --manifest .codex-plugin/plugin.json check
        files: >-
          ^(pyproject\.toml|\.claude-plugin/plugin\.json|\.codex-plugin/plugin\.json|docs/([^/]+/)?CHANGELOG\.md)$
        pass_filenames: false
