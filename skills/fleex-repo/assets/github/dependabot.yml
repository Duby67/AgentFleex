version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Batch minor and patch version updates. Major and security updates are individual PRs.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
