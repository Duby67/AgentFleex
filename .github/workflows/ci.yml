name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.ctags && ', ctags' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
        # Ctags on the latest Python only, so Linux and macOS also test the pattern parser alone.
        include:
          - os: ubuntu-latest
            python: "3.x"
            ctags: true
          - os: macos-latest
            python: "3.x"
            ctags: true
    steps:
      # Git for Windows checks symlinks out as text files unless told otherwise.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'Linux'
        run: sudo apt-get install -y universal-ctags
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'macOS'
        run: brew install universal-ctags
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Skill checks
        if: runner.os != 'Windows'
        run: bash skills/fleex-skills/scripts/check.sh
      - name: Skill checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./skills/fleex-skills/scripts/check.ps1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uvx tools only: no lock file to key a cache on.
          enable-cache: false
      - name: Ruff
        run: uvx ruff check . && uvx ruff format --check .
      - name: Mypy
        env:
          # The hook imports checks.py by path at runtime; this lets mypy resolve and check it.
          MYPYPATH: skills/fleex-hygiene/scripts
        run: >-
          uvx mypy --config-file skills/fleex-hygiene/assets/mypy.ini
          skills/fleex-hygiene/scripts/checks.py skills/fleex-index/scripts/index.py
          skills/fleex-vscode/scripts/vscode.py hooks/agentfleex.py tests
      - name: ShellCheck
        run: uvx --from shellcheck-py shellcheck skills/fleex-skills/scripts/check.sh
      - name: Pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Extension packs
        run: |
          for pack in skills/fleex-vscode/assets/packs/*/; do
            (cd "$pack" && npx --yes @vscode/vsce@3.9.2 package --skip-license --out "$RUNNER_TEMP/")
          done
      - name: Whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

  release:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history brings every tag to compare the manifest version with.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The tag is the manifest version, so they always match. A version with a release is skipped;
      # a tag without a release, such as one pushed by hand, gets its release from the existing tag.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "::notice::$version is already released; raise the manifest version to release."
            exit 0
          fi
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          newest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)"
          target=()
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            target=(--target "$GITHUB_SHA")
            unreleased="$(awk '$0 == "## Unreleased" { found = 1; next } /^## / { found = 0 } found' \
              CHANGELOG.md)"
            if grep -q '[^[:space:]]' <<<"$unreleased"; then
              echo "::error::CHANGELOG.md: move the ## Unreleased items to ## [$version]"
              exit 1
            fi
            if [ "$newest" != "$version" ]; then
              echo "::error::manifest version $version is lower than the latest release $latest"
              exit 1
            fi
          fi
          # Notes: the English section, then each translation's section collapsed under its language
          # name, taken from the bold current language in the translation's switcher line.
          section() {
            awk -v head="## [$version]" \
              'index($0, head) == 1 { found = 1; next } /^## / { found = 0 } found' "$1"
          }
          for changelog in CHANGELOG.md docs/*/CHANGELOG.md; do
            [ -f "$changelog" ] || continue
            if ! grep -q '[^[:space:]]' <<<"$(section "$changelog")"; then
              echo "::error::$changelog has no notes under ## [$version]"
              exit 1
            fi
          done
          section CHANGELOG.md > notes.md
          for changelog in docs/*/CHANGELOG.md; do
            [ -f "$changelog" ] || continue
            language="$(sed -n 's/.*\*\*\([^*]*\)\*\*.*/\1/p' "$changelog" | head -n1)"
            if [ -z "$language" ]; then
              echo "::error::$changelog: no bold language name in its switcher line"
              exit 1
            fi
            printf '\n<details><summary>%s</summary>\n\n%s\n\n</details>\n' \
              "$language" "$(section "$changelog")" >> notes.md
          done
          # Extension packs carry the plugin version, so the plugin's script finds them by it.
          mkdir dist
          for pack in skills/fleex-vscode/assets/packs/*/; do
            jq --arg v "$version" '.version = $v' "$pack/package.json" > package.json.tmp
            mv package.json.tmp "$pack/package.json"
            (cd "$pack" && npx --yes @vscode/vsce@3.9.2 package --skip-license --out "$GITHUB_WORKSPACE/dist/")
          done
          # Only the newest version is marked as the latest release.
          gh release create "$version" dist/*.vsix "${target[@]}" --title "$version" \
            --notes-file notes.md --latest="$([ "$newest" = "$version" ] && echo true || echo false)"
