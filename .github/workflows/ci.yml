name: CI

# A push to develop runs the checks; a pull request into main shows them for its head commit and
# adds the release check; a push to main releases.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/develop'
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.ctags && ', ctags' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
        # Ctags on the latest Python only, so Linux and macOS also test the pattern parser alone.
        include:
          - os: ubuntu-latest
            python: "3.x"
            ctags: true
          - os: macos-latest
            python: "3.x"
            ctags: true
    steps:
      # Git for Windows checks symlinks out as text files unless told otherwise.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'Linux'
        run: sudo apt-get install -y universal-ctags
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'macOS'
        run: brew install universal-ctags
      - name: Tests
        run: uv run --locked --no-dev python -m unittest discover -s tests -v
      - name: Skill checks
        if: runner.os != 'Windows'
        run: bash skills/fleex-skills/scripts/check.sh
      - name: Skill checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./skills/fleex-skills/scripts/check.ps1

  lint:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Pre-commit
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  # Every merge into main is a release: its version must be new and above the latest tag. The
  # release job repeats this check before tagging.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history brings every tag to compare the manifest version with.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Version and changelogs
        run: uv run --locked --no-dev python .github/scripts/release.py check --release

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(uv run --locked --no-dev python .github/scripts/release.py check --release)"
          uv run --locked --no-dev python .github/scripts/release.py notes > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
