name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.ctags && ', ctags' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
        # Ctags on the latest Python only, so Linux and macOS also test the pattern parser alone.
        include:
          - os: ubuntu-latest
            python: "3.x"
            ctags: true
          - os: macos-latest
            python: "3.x"
            ctags: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'Linux'
        run: sudo apt-get install -y universal-ctags
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'macOS'
        run: brew install universal-ctags
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Skill checks
        if: runner.os != 'Windows'
        run: bash skills/fleex-skills/scripts/check.sh
      - name: Skill checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./skills/fleex-skills/scripts/check.ps1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uvx tools only: no lock file to key a cache on.
          enable-cache: false
      - name: Ruff
        run: uvx ruff check . && uvx ruff format --check .
      - name: Mypy
        run: >-
          uvx mypy --config-file skills/fleex-hygiene/assets/mypy.ini
          skills/fleex-hygiene/scripts/checks.py skills/fleex-index/scripts/index.py tests
      - name: ShellCheck
        run: shellcheck skills/fleex-skills/scripts/check.sh
      - name: Whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
