name: CI

# A pull request into develop and a push to develop run the checks; a pull request into main shows
# them for its head commit and adds the release check; a push to main releases. Branch protection
# requires the checks job.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A newer run replaces an unfinished one, except a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.ctags && ', ctags' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
        # Ctags on the latest Python only, so Linux and macOS also test the pattern parser alone.
        include:
          - os: ubuntu-latest
            python: "3.x"
            ctags: true
          - os: macos-latest
            python: "3.x"
            ctags: true
    steps:
      # Git for Windows checks symlinks out as text files unless told otherwise.
      - name: Enable symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # uv does not read version ranges such as 3.x; it runs the interpreter setup-python installed.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: ${{ steps.python.outputs.python-path }}
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'Linux'
        run: sudo apt-get install -y universal-ctags
      - name: Install Universal Ctags
        if: matrix.ctags && runner.os == 'macOS'
        run: brew install universal-ctags
      - name: Tests
        run: uv run --locked --no-dev python -m unittest discover -s tests -v
      - name: Skill checks
        if: runner.os != 'Windows'
        run: bash skills/fleex-skills/scripts/check.sh
      - name: Skill checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./skills/fleex-skills/scripts/check.ps1

  lint:
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Pre-commit
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  # Every merge into main is a release from develop: its version must be new and above the latest
  # tag. The release job repeats this check before tagging.
  version:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history brings every tag to compare the manifest version with.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Source branch
        if: github.head_ref != 'develop'
        run: |
          echo "::error::Only develop merges into main; retarget this pull request at develop."
          exit 1
      - name: Version and changelogs
        run: >-
          uv run --locked --no-dev python skills/fleex-repo/scripts/release.py
          --manifest .claude-plugin/plugin.json --manifest .codex-plugin/plugin.json check --release

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="uv run --locked --no-dev python skills/fleex-repo/scripts/release.py"
          manifests="--manifest .claude-plugin/plugin.json --manifest .codex-plugin/plugin.json"
          version="$($release $manifests check --release)"
          $release notes > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest

  # One stable status for branch protection: fails when a needed job failed or was cancelled.
  checks:
    if: always() && github.event_name == 'pull_request'
    needs: [test, lint, version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Needed jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A needed job failed or was cancelled."
          exit 1
