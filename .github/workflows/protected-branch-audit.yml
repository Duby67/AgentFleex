name: Protected branch soft-guard audit

on:
  push:
    branches:
      - integration
      - dev
      - production

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: protected-branch-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-push-origin:
    name: Verify merged PR origin
    runs-on: ubuntu-latest
    steps:
      - name: Audit pushed SHA against the required PR flow
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.ref.replace('refs/heads/', '');
            const allowedHead = {
              integration: (head) => /^(feature|fix|docs|test|deploy|qol)-.+$/.test(head),
              dev: (head) => head === 'integration',
              production: (head) => head === 'dev',
            };

            const validateHead = allowedHead[target];
            if (!validateHead) {
              core.setFailed(`Protected branch audit does not recognize target '${target}'.`);
              return;
            }

            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );
            const matching = pullRequests.filter((pullRequest) =>
              pullRequest.merged_at !== null &&
              pullRequest.base.ref === target &&
              pullRequest.merge_commit_sha === context.sha &&
              validateHead(pullRequest.head.ref),
            );

            if (matching.length === 0) {
              core.setFailed(
                `SOFT GUARD AUDIT FAILED: SHA ${context.sha} on '${target}' is not the result ` +
                `of an allowed merged PR. The branch update has already occurred and requires ` +
                `manual inspection; this workflow will not revert or rewrite Git history.`,
              );
              return;
            }

            core.info(
              `Protected branch audit passed: ${matching[0].head.ref} -> ` +
              `${target} via merged PR #${matching[0].number}.`,
            );
